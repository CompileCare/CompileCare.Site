<!--?xml version="1.0" encoding="utf-8"?-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="auto">
  <defs>
    <linearGradient id="grad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1976d2"></stop>
      <stop offset="100%" stop-color="#00bcd4"></stop>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc"></rect>

  <!-- Monitor frame -->
  <rect x="100" y="60" width="600" height="360" rx="16" fill="white" stroke="#d0d7de" stroke-width="2"></rect>
  <rect x="100" y="60" width="600" height="40" rx="16" ry="16" fill="#1976d2"></rect>
  <circle cx="130" cy="80" r="6" fill="#ffffff" opacity="0.8"></circle>
  <circle cx="150" cy="80" r="6" fill="#ffffff" opacity="0.8"></circle>
  <circle cx="170" cy="80" r="6" fill="#ffffff" opacity="0.8"></circle>

  <!-- Dashboard Title -->
  <text x="200" y="85" fill="#ffffff" font-size="18" font-family="Segoe UI, sans-serif" font-weight="600">
    CompileCare Hospital Dashboard
  </text>

  <!-- Sidebar -->
  <rect x="120" y="120" width="120" height="260" rx="8" fill="#e3f2fd"></rect>
  <rect x="140" y="140" width="80" height="20" rx="4" fill="url(#grad)"></rect>
  <rect x="140" y="180" width="60" height="14" rx="3" fill="#90caf9"></rect>
  <rect x="140" y="210" width="60" height="14" rx="3" fill="#90caf9"></rect>
  <rect x="140" y="240" width="60" height="14" rx="3" fill="#90caf9"></rect>
  <rect x="140" y="270" width="60" height="14" rx="3" fill="#90caf9"></rect>
  <rect x="140" y="300" width="60" height="14" rx="3" fill="#90caf9"></rect>
  <rect x="140" y="330" width="60" height="14" rx="3" fill="#90caf9"></rect>

  <!-- Dashboard content -->
  <rect x="260" y="120" width="400" height="260" rx="8" fill="#f5faff" stroke="#e0e0e0"></rect>
  <text x="280" y="150" font-size="16" font-family="Segoe UI" fill="#1976d2" font-weight="600">
    Daily Overview
  </text>

  <!-- Chart lines -->
  <polyline points="280,300 320,260 360,270 400,220 440,250 480,200 520,240 560,210 600,270" fill="none" stroke="url(#grad)" stroke-width="4" stroke-linecap="round"></polyline>

  <!-- Grid lines -->
  <line x1="280" y1="320" x2="640" y2="320" stroke="#e0e0e0" stroke-width="1"></line>
  <line x1="280" y1="280" x2="640" y2="280" stroke="#e0e0e0" stroke-width="1"></line>
  <line x1="280" y1="240" x2="640" y2="240" stroke="#e0e0e0" stroke-width="1"></line>
  <line x1="280" y1="200" x2="640" y2="200" stroke="#e0e0e0" stroke-width="1"></line>

  <!-- Small stats cards -->
  <rect x="280" y="340" width="100" height="30" rx="6" fill="#1976d2" opacity="0.15"></rect>
  <rect x="400" y="340" width="100" height="30" rx="6" fill="#1976d2" opacity="0.15"></rect>
  <rect x="520" y="340" width="100" height="30" rx="6" fill="#1976d2" opacity="0.15"></rect>

  <text x="290" y="360" font-size="13" fill="#0d47a1">Patients</text>
  <text x="410" y="360" font-size="13" fill="#0d47a1">Appointments</text>
  <text x="530" y="360" font-size="13" fill="#0d47a1">Revenue</text>

  <!-- Medical cross in top right -->
  <g transform="translate(620,160)">
    <rect x="20" y="0" width="20" height="60" rx="4" fill="url(#grad)"></rect>
    <rect x="0" y="20" width="60" height="20" rx="4" fill="url(#grad)"></rect>
  </g>

  <!-- Doctor avatar circle -->
  <circle cx="620" cy="320" r="24" fill="url(#grad)"></circle>
  <path d="M620 312 a8 8 0 1 1 0-16 a8 8 0 1 1 0 16z" fill="white"></path>
  <path d="M608 326 q12 -8 24 0 v6 h-24z" fill="white"></path>
</svg>
